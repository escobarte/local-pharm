<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Local Pharm — Коробка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#122056}a:hover{color:#0D1840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFD; font-family: Inter, Helvetica, Arial, sans-serif; color: #122056; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="Storage-v3.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #122056"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="font-size: 15px; font-weight: 600">Коробка</span>
    <button type="button" aria-label="Показать QR-код" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #122056"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg></button>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: #122056; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">2</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Коробка 2</h1>
        <span style="font-size: 14px; color: #5A6283">Основной склад · Простуда, горло, нос</span>
      </div>
    </div>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6283">Отсеки</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px; border-radius: 16px; background: #FFFFFF; border: 2px solid #122056">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 64px; padding: 10px; border-radius: 10px; border: 0; font: inherit; text-align: left; background: {{c.bg}}; color: {{c.fg}}">
            <span style="font-size: 15px; font-weight: 700">{{c.code}}</span>
            <span style="font-size: 12px">{{c.count}}</span>
          </button>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6283">Отсек {{selected}}</h2>
      <sc-for list="{{items}}" as="i" hint-placeholder-count="3">
        <a href="Medication-v3.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; text-decoration: none; color: #122056">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: #EEEFFD"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{i.name}}</span><span style="font-size: 12px; color: #5A6283">{{i.meta}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </section>
    <div style="display: flex; gap: 8px">
      <a href="Add-v3.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #122056; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Добавить сюда</a>
      <button type="button" style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #122056">Печать QR</button>
    </div>
  </main>
  <nav aria-label="Основная навигация" style="display: flex; align-items: flex-end; background: #FFFFFF; border-top: 1px solid #EEEFFD; padding: 8px 8px 18px">
    <a href="Home-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>
    <a href="Storage-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #122056"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Хранение</a>
    <a href="Add-v3.dc.html" aria-label="Добавить препарат" style="flex: 1; display: flex; justify-content: center; text-decoration: none"><span style="width: 56px; height: 56px; border-radius: 28px; background: #00B5AA; color: #122056; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 4px 12px rgba(18,32,86,0.2)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Expiry-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сроки</a>
    <a href="Shopping-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11l2-8H6.5"/></svg>Покупки</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'A1';
const data = {
A1: [{ name: 'Терафлю', meta: 'Порошок · 4 пак. · до 02/2027' }, { name: 'Колдрекс', meta: 'Порошок · 2 пак. · до 10/2026' }],
A2: [{ name: 'Стрепсилс', meta: 'Пастилки · 16 шт. · до 05/2027' }, { name: 'Гексорал', meta: 'Спрей · 1 фл. · до 09/2027' }],
A3: [{ name: 'Аквамарис', meta: 'Спрей · 1 фл. · до 01/2027' }],
B1: [{ name: 'Амбробене', meta: 'Сироп · 1 фл. · до 06/2027' }],
B2: [{ name: 'Нафтизин', meta: 'Капли · 2 фл. · до 12/2026' }],
B3: []
};
const codes = ['A1', 'A2', 'A3', 'B1', 'B2', 'B3'];
return {
selected: sel,
cells: codes.map((c) => ({
code: c,
count: data[c].length ? data[c].length + ' преп.' : 'пусто',
bg: c === sel ? '#00B5AA' : '#FAFAFD',
fg: '#122056',
pressed: c === sel ? 'true' : 'false',
pick: () => this.setState({ sel: c })
})),
items: data[sel]
};
}
}
</script>
</body>
</html>

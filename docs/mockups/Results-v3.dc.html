<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Local Pharm — Результаты поиска</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#122056}a:hover{color:#0D1840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFD; font-family: Inter, Helvetica, Arial, sans-serif; color: #122056; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 12px; background: #FAFAFD">
    <a href="Home-v3.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #122056"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <label style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDDFF3; color: #5A6283">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" value="температура" aria-label="Поиск препарата" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #122056">
    </label>
  </header>
  <div style="display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto">
    <button type="button" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #122056; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">Все</button>
    <button type="button" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDDFF3; background: #FFFFFF; color: #122056; font: inherit; font-size: 13px; font-weight: 500">Боль и температура</button>
    <button type="button" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDDFF3; background: #FFFFFF; color: #122056; font: inherit; font-size: 13px; font-weight: 500">Простуда</button>
    <button type="button" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDDFF3; background: #FFFFFF; color: #122056; font: inherit; font-size: 13px; font-weight: 500">Детское</button>
  </div>
  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0 0 2px; font-size: 13px; color: #5A6283">Найдено: 3 препарата</p>
    <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
      <a href="Medication-v3.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: #FFFFFF; text-decoration: none; color: #122056">
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <span style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: #EEEFFD"></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
            <span style="font-size: 13px; color: #5A6283">{{r.sub}}</span>
          </div>
          <sc-if value="{{r.badge}}" hint-placeholder-val="{{ true }}">
            <span style="flex: none; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; background: {{r.badgeBg}}; color: {{r.badgeFg}}">{{r.badge}}</span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #FAFAFD; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00B5AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span style="flex: 1; font-weight: 600">{{r.place}}</span>
          <span style="color: #5A6283">{{r.meta}}</span>
        </div>
      </a>
    </sc-for>
  </main>
  <nav aria-label="Основная навигация" style="display: flex; align-items: flex-end; background: #FFFFFF; border-top: 1px solid #EEEFFD; padding: 8px 8px 18px">
    <a href="Home-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #122056"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>
    <a href="Storage-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Хранение</a>
    <a href="Add-v3.dc.html" aria-label="Добавить препарат" style="flex: 1; display: flex; justify-content: center; text-decoration: none"><span style="width: 56px; height: 56px; border-radius: 28px; background: #00B5AA; color: #122056; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 4px 12px rgba(18,32,86,0.2)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Expiry-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сроки</a>
    <a href="Shopping-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11l2-8H6.5"/></svg>Покупки</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
results: [
{ name: 'Парацетамол 500 мг', sub: 'Парацетамол · таблетки', place: 'Быстрая аптечка · A1', meta: 'до 03/2027 · 8 шт.', badge: '', badgeBg: '', badgeFg: '' },
{ name: 'Нурофен 200 мг', sub: 'Ибупрофен · таблетки', place: 'Коробка 1 · B2', meta: 'до 12/2026 · 12 шт.', badge: 'Истекает', badgeBg: '#FFF1E0', badgeFg: '#9A4A00' },
{ name: 'Нурофен для детей', sub: 'Ибупрофен · суспензия', place: 'Коробка 4 · A1', meta: 'до 08/2027 · 1 фл.', badge: 'Мало', badgeBg: '#EEEFFD', badgeFg: '#122056' }
]
};
}
}
</script>
</body>
</html>

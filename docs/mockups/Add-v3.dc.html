<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Local Pharm — Добавление препарата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#122056}a:hover{color:#0D1840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFD; font-family: Inter, Helvetica, Arial, sans-serif; color: #122056; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="Home-v3.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #122056"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span style="font-size: 15px; font-weight: 600">Добавить препарат</span>
    <span style="width: 44px"></span>
  </header>
  <div role="tablist" aria-label="Способ добавления" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 4px 20px 12px; padding: 4px; border-radius: 14px; background: #EEEFFD">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" role="tab" onClick="{{m.pick}}" style="min-height: 40px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; background: {{m.bg}}; color: #122056">{{m.label}}</button>
    </sc-for>
  </div>
  <main style="flex: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{isScan}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="position: relative; height: 190px; border-radius: 16px; background: #122056; display: flex; align-items: center; justify-content: center">
          <div style="width: 220px; height: 110px; border: 2px solid #00B5AA; border-radius: 12px"></div>
          <span style="position: absolute; bottom: 14px; font-size: 13px; color: #FFFFFF">Наведите камеру на штрихкод</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #EEEFFD">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#122056" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          <span style="flex: 1; font-size: 14px; font-weight: 600">Нурофен 200 мг</span>
          <span style="font-size: 12px; color: #0D1840">локальная база</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isSearch}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDDFF3; color: #5A6283">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" value="ибупрофен" aria-label="Название препарата" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #122056">
        </label>
        <sc-for list="{{found}}" as="f" hint-placeholder-count="3">
          <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 0; background: #FFFFFF; font: inherit; color: #122056; text-align: left">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{f.name}}</span><span style="font-size: 12px; color: #5A6283">{{f.sub}}</span></span>
            <span style="padding: 4px 8px; border-radius: 8px; background: #EEEFFD; font-size: 11px; font-weight: 600; color: #5A6283">{{f.src}}</span>
          </button>
        </sc-for>
        <p style="margin: 0; font-size: 13px; color: #5A6283">Поиск: своя база → AMDM → openFDA / RxNorm</p>
      </div>
    </sc-if>
    <sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{manualFields}}" as="mf" hint-placeholder-count="4">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">{{mf.label}}
            <input type="text" placeholder="{{mf.ph}}" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400; color: #122056">
          </label>
        </sc-for>
      </div>
    </sc-if>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6283">Упаковка</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Количество
          <input type="text" value="12 шт." style="min-height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400; color: #122056">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Годен до
          <input type="text" value="12/2026" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400; color: #122056">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Коробка
          <select style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400; color: #122056"><option>Коробка 1</option><option>Быстрая аптечка</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Отсек
          <select style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #DDDFF3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400; color: #122056"><option>B2</option><option>A1</option></select>
        </label>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 1px dashed #9DA2C8; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #122056">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Фото упаковки
      </button>
    </section>
  </main>
  <div style="padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #EEEFFD">
    <a href="Medication-v3.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #122056; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Сохранить</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const mode = (this.state && this.state.mode) || 'scan';
const defs = [{ id: 'scan', label: 'Скан' }, { id: 'search', label: 'Поиск' }, { id: 'manual', label: 'Вручную' }];
return {
modes: defs.map((d) => ({ label: d.label, bg: d.id === mode ? '#FFFFFF' : 'transparent', pick: () => this.setState({ mode: d.id }) })),
isScan: mode === 'scan',
isSearch: mode === 'search',
isManual: mode === 'manual',
found: [
{ name: 'Нурофен 200 мг', sub: 'Ибупрофен · таблетки', src: 'своя база' },
{ name: 'Ибупрофен 400 мг', sub: 'Ибупрофен · таблетки', src: 'AMDM' },
{ name: 'Ibuprofen 200 mg', sub: 'Ibuprofen · tablet', src: 'openFDA' }
],
manualFields: [
{ label: 'Название', ph: 'Например, Нурофен' },
{ label: 'Действующее вещество', ph: 'Например, ибупрофен' },
{ label: 'Форма и дозировка', ph: 'Таблетки, 200 мг' },
{ label: 'Категория', ph: 'Боль и температура' }
]
};
}
}
</script>
</body>
</html>

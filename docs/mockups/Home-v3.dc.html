<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Local Pharm — Главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#122056}a:hover{color:#0D1840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFD; font-family: Inter, Helvetica, Arial, sans-serif; color: #122056; overflow: hidden">
  <main style="flex: 1; overflow-y: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 700">Local Pharm</span>
      <div style="display: flex">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #00B5AA; color: #122056; border: 2px solid #FAFAFD; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">А</span>
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #122056; color: #FFFFFF; border: 2px solid #FAFAFD; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">М</span>
      </div>
    </header>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Что ищем?</h1>
    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDDFF3; color: #5A6283">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" placeholder="Название, вещество или симптом" aria-label="Поиск препарата" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #122056">
      </label>
      <a href="Add-v3.dc.html" aria-label="Сканировать штрихкод" style="width: 52px; height: 52px; border-radius: 14px; background: #122056; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>
      </a>
    </div>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6283">Внимание</h2>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a href="Shopping-v3.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #FFFFFF; text-decoration: none; color: #122056">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEEFFD; color: #122056; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11l2-8H6.5"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">3 препарата заканчиваются</span><span style="font-size: 13px; color: #5A6283">добавлены в список покупок</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6283">Категории</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{categories}}" as="c" hint-placeholder-count="9">
          <a href="Results-v3.dc.html" style="display: flex; flex-direction: column; gap: 8px; min-height: 84px; padding: 12px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; text-decoration: none; color: #122056">
            <span style="width: 28px; height: 28px; border-radius: 8px; background: #EEEFFD"></span>
            <span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{c.name}}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </main>
  <nav aria-label="Основная навигация" style="display: flex; align-items: flex-end; background: #FFFFFF; border-top: 1px solid #EEEFFD; padding: 8px 8px 18px">
    <a href="Home-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 600; color: #122056"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>

    <a href="Add-v3.dc.html" aria-label="Добавить препарат" style="flex: 1; display: flex; justify-content: center; text-decoration: none"><span style="width: 56px; height: 56px; border-radius: 28px; background: #00B5AA; color: #122056; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 4px 12px rgba(18,32,86,0.2)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Expiry-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сроки</a>
    <a href="Shopping-v3.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 11px; font-weight: 500; color: #5A6283"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11l2-8H6.5"/></svg>Покупки</a>
  </nav>
</div>
</x-dc>

return {

{ name: 'Боль и температура' },
{ name: 'Простуда, горло, нос' },
{ name: 'Пищеварение' },
{ name: 'Аллергия' },
{ name: 'Раны и перевязка' },
{ name: 'Давление и сердце' },
{ name: 'Витамины' },

]
};
}
}
</script>
